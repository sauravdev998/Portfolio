<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    The OS mark as an app tile: the same window glyph the menu bar draws
    (src/components/menubar/Logo.tsx), set on the dusk wallpaper gradient.
    One identity in both places.

    Drawn for 16px first — no thin hairlines, no detail that survives only at 64.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26184b" />
      <stop offset="1" stop-color="#4c276e" />
    </linearGradient>

    <!-- The warm glow the wallpaper carries in its lower-right corner. -->
    <radialGradient id="glow" cx="1" cy="1" r="1.05">
      <stop offset="0" stop-color="#e5946f" stop-opacity="0.55" />
      <stop offset="0.55" stop-color="#c86265" stop-opacity="0.22" />
      <stop offset="1" stop-color="#c86265" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#tile)" />
  <rect width="64" height="64" rx="14" fill="url(#glow)" />

  <!-- Matches the chrome-stroke token: the hairline every OS surface wears. -->
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25"
        fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.5" />

  <g transform="translate(8 8) scale(3)" fill="none" stroke="#ffffff"
     stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <rect x="1.7" y="2.7" width="12.6" height="10.6" rx="2.6" />
    <path d="M1.7 6.1h12.6" />
    <circle cx="4.4" cy="4.4" r="0.75" fill="#ffffff" stroke="none" />
    <circle cx="6.4" cy="4.4" r="0.75" fill="#ffffff" stroke="none" />
  </g>
</svg>
